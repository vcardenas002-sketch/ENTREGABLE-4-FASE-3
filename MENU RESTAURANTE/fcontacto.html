
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow p-4">
                    <h1 class="text-center mb-4">Formulario de contacto</h1>

                    <p class="text-center text-muted">
                        Completa tus datos y nos pondremos en contacto contigo.
                    </p>

                    <form id="formulario">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre"
                                class="form-control" placeholder="Escribe tu nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" id="correo" name="correo"
                                class="form-control" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono"
                                class="form-control" placeholder="Escribe tu teléfono">
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label">Asunto</label>
                            <input type="text" id="asunto" name="asunto"
                                class="form-control" placeholder="Motivo del mensaje">
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea id="mensaje" name="mensaje"
                                class="form-control" rows="4"
                                placeholder="Escribe tu mensaje" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Enviar mensaje
                        </button>

                    </form>

                    <div id="resultado" class="mt-3"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // 1. Seleccionar el primer campo de texto y cambiar su fondo.
        const primerCampo = document.querySelector('input[type="text"]');
        primerCampo.classList.add('bg-success', 'bg-opacity-25');

        // 2. Seleccionar todos los botones y aplicar btn-danger.
        const botones = document.querySelectorAll('button');

        botones.forEach(function(boton) {
            boton.classList.remove('btn-primary');
            boton.classList.add('btn-danger');
        });

        // 3. Seleccionar el campo de nombre con getElementsByName.
        const campoNombre = document.getElementsByName('nombre');
        campoNombre[0].classList.add('text-warning');

        // Mostrar un mensaje al enviar el formulario.
        const formulario = document.querySelector('#formulario');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();

            document.querySelector('#resultado').innerHTML =
                '<div class="alert alert-success">¡Tu mensaje se ha enviado correctamente!</div>';

            formulario.reset();
        });
    </script>

</body>
</html>
