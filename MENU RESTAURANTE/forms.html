<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
</head>
<body>
    <label class="form-label">Etiqueta del Campo</label>
<input type="text" class="form-control" id="exampleInput"
placeholder="Introduce tu texto aquí">
<label class="form-label">Etiqueta del Área de Texto</label>
<textarea class="form-control" id="exampleTextarea" rows="4"
placeholder="Introduce tu texto aquí"></textarea>

<label class="form-label">Etiqueta del Select</label>
<select class="form-select" id="exampleSelect">
<option selected>Que quieres comer?</option>
<option value="1">Pizza</option>
<option value="2">Pasta</option>
<option value="3">Pan</option>
</select>

<div class="form-check">
<input class="form-check-input" type="checkbox" id="checkbox1">
<label class="form-check-label">Especies</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" id="checkbox2">
<label class="form-check-label">Peperoni</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" id="checkbox3">
<label class="form-check-label"> Hawaina </label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="radioOptions" id="radio1" value="option1">
<label class="form-check-label">Tradicional</label>
</div>
<div class="form-check">
<input class="form-check-input" type="radio" name="radioOptions" id="radio2" value="option2">
<label class="form-check-label">Orilla de queso (Seleccionada por defecto)</label>
</div>
<div class="form-check">
<input class="form-check-input" type="radio" name="radioOptions" id="radio3" value="option3">
<label class="form-check-label">Al sartén </label>
</div>

</body>
</html>
